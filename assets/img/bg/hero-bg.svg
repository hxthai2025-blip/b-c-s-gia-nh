<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice">
<style>
 .t{fill:#0e8a6e}.ts{stroke:#0e8a6e;fill:none}.o{fill:#e9843a}.r{fill:#e5534b}.cl{fill:#fff}
 @keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(70px)}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
 @keyframes spin{to{transform:rotate(360deg)}}
 @keyframes glow{0%,100%{opacity:.55}50%{opacity:.8}}
 .d1{animation:drift 26s ease-in-out infinite}.d2{animation:drift 34s ease-in-out infinite reverse}
 .f1{animation:float 5s ease-in-out infinite}.f2{animation:float 6.5s ease-in-out infinite -2s}.f3{animation:float 7.5s ease-in-out infinite -4s}
 .sun{transform-box:fill-box;transform-origin:50% 50%;animation:spin 90s linear infinite}
 .gl{animation:glow 6s ease-in-out infinite}
 @media (prefers-color-scheme: dark){.t{fill:#5cc2a8}.ts{stroke:#5cc2a8}.o{fill:#e9ad55}.r{fill:#f08a80}.cl{fill:#cfe6e0}.cl{opacity:.12}.core{fill:#f3e6b0;opacity:.8}.gl{opacity:.3}}
 @media (prefers-reduced-motion: reduce){.d1,.d2,.f1,.f2,.f3,.sun,.gl{animation:none}}
</style>
<defs><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe08a" stop-opacity=".95"/><stop offset=".5" stop-color="#ffd45e" stop-opacity=".35"/><stop offset="1" stop-color="#ffd45e" stop-opacity="0"/></radialGradient></defs>
<!-- sun -->
<circle class="gl" cx="1330" cy="130" r="260" fill="url(#g)"/>
<g class="sun"><g stroke="#ffcf4a" stroke-width="6" stroke-linecap="round" opacity=".8">
 <path d="M1330 40v-24M1330 220v24M1240 130h-24M1420 130h24M1266 66l-17-17M1394 194l17 17M1394 66l17-17M1266 194l-17 17"/></g></g>
<circle class="core" cx="1330" cy="130" r="52" fill="#ffd45e"/>
<!-- clouds -->
<g class="d1 cl" opacity=".85"><ellipse cx="420" cy="86" rx="70" ry="22"/><ellipse cx="470" cy="70" rx="46" ry="22"/><ellipse cx="380" cy="72" rx="36" ry="18"/></g>
<g class="d2 cl" opacity=".75"><ellipse cx="900" cy="48" rx="60" ry="18"/><ellipse cx="940" cy="36" rx="38" ry="18"/></g>
<g class="d1 cl" opacity=".7"><ellipse cx="1080" cy="230" rx="54" ry="16"/><ellipse cx="1112" cy="220" rx="32" ry="15"/></g>
<!-- floating symbols -->
<g class="f1"><path class="r" opacity=".75" d="M1000 118c-7-11-23-4-18 10 4 8 18 16 18 16s14-8 18-16c5-14-11-21-18-10z"/></g>
<g class="f2"><path class="r" opacity=".6" d="M560 30c-5-8-17-3-13 7 3 6 13 12 13 12s10-6 13-12c4-10-8-15-13-7z"/></g>
<g class="f3 ts" stroke-width="6" stroke-linecap="round" opacity=".5"><path d="M770 26v30M755 41h30"/></g>
<g class="f2 ts" stroke-width="6" stroke-linecap="round" opacity=".45"><path d="M1480 280v28M1466 294h28"/></g>
<g class="f1 ts" stroke-width="5" stroke-linecap="round" opacity=".4"><path d="M70 40v24M58 52h24"/></g>
<g class="f3"><circle class="o" cx="1160" cy="330" r="9" opacity=".6"/><circle class="t" cx="1540" cy="430" r="7" opacity=".4"/><circle class="o" cx="40" cy="150" r="11" opacity=".35"/></g>
</svg>
