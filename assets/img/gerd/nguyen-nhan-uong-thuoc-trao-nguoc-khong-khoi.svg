<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="Be Vietnam Pro, Arial, Helvetica, sans-serif">
<rect width="600" height="360" rx="16" fill="#ffffff"/>
<text x="300" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#16262b">Vì sao uống thuốc mà chưa đỡ?</text>
<g font-size="15" fill="#16262b">
<rect x="24" y="60" width="176" height="130" rx="12" fill="#e2f0ec"/><circle cx="112" cy="86" r="20" fill="#0e5a4c"/><text x="112" y="93" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">1</text><text x="112" y="130" text-anchor="middle" font-weight="700" fill="#0e5a4c">Uống sai giờ</text><text x="112" y="152" text-anchor="middle">hoặc hay quên liều</text>
<rect x="212" y="60" width="176" height="130" rx="12" fill="#e2f0ec"/><circle cx="300" cy="86" r="20" fill="#0e5a4c"/><text x="300" y="93" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">2</text><text x="300" y="130" text-anchor="middle" font-weight="700" fill="#0e5a4c">Liều, thời gian</text><text x="300" y="152" text-anchor="middle">chưa phù hợp</text>
<rect x="400" y="60" width="176" height="130" rx="12" fill="#e2f0ec"/><circle cx="488" cy="86" r="20" fill="#0e5a4c"/><text x="488" y="93" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">3</text><text x="488" y="130" text-anchor="middle" font-weight="700" fill="#0e5a4c">Trào ngược</text><text x="488" y="152" text-anchor="middle">không acid</text>
<rect x="24" y="204" width="176" height="130" rx="12" fill="#fbf0de"/><circle cx="112" cy="230" r="20" fill="#d9902b"/><text x="112" y="237" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">4</text><text x="112" y="274" text-anchor="middle" font-weight="700" fill="#a86a12">Thoát vị</text><text x="112" y="296" text-anchor="middle">khe hoành</text>
<rect x="212" y="204" width="176" height="130" rx="12" fill="#fbf0de"/><circle cx="300" cy="230" r="20" fill="#d9902b"/><text x="300" y="237" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">5</text><text x="300" y="274" text-anchor="middle" font-weight="700" fill="#a86a12">Bệnh khác</text><text x="300" y="296" text-anchor="middle">có triệu chứng giống</text><text x="300" y="316" text-anchor="middle">trào ngược</text>
<rect x="400" y="204" width="176" height="130" rx="12" fill="#fbf0de"/><circle cx="488" cy="230" r="20" fill="#d9902b"/><text x="488" y="237" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">6</text><text x="488" y="274" text-anchor="middle" font-weight="700" fill="#a86a12">Đau ngực</text><text x="488" y="296" text-anchor="middle">cần loại trừ</text><text x="488" y="316" text-anchor="middle">bệnh tim</text>
</g>
</svg>
