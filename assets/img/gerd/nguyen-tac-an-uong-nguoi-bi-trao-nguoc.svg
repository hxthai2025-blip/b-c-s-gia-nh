<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="Be Vietnam Pro, Arial, Helvetica, sans-serif">
<rect width="600" height="380" rx="16" fill="#ffffff"/>
<text x="300" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#16262b">4 nguyên tắc ăn uống khi bị trào ngược</text>
<g>
<rect x="24" y="62" width="268" height="140" rx="14" fill="#e2f0ec"/>
<circle cx="80" cy="120" r="34" fill="#fff" stroke="#0e5a4c" stroke-width="4"/><path d="M80 120 L80 86 A34 34 0 0 1 110 104 Z" fill="#0e5a4c"/>
<text x="128" y="112" font-size="18" font-weight="700" fill="#0e5a4c">Ăn vừa đủ</text>
<text x="128" y="134" font-size="15" fill="#16262b">Tránh ăn quá no</text>
<text x="128" y="154" font-size="15" fill="#16262b">trong một bữa</text>
</g>
<g>
<rect x="308" y="62" width="268" height="140" rx="14" fill="#e2f0ec"/>
<circle cx="364" cy="120" r="34" fill="#fff" stroke="#0e5a4c" stroke-width="4"/><path d="M364 120 L364 96 M364 120 L380 128" stroke="#0e5a4c" stroke-width="4" stroke-linecap="round"/>
<text x="412" y="112" font-size="18" font-weight="700" fill="#0e5a4c">Ăn chậm</text>
<text x="412" y="134" font-size="15" fill="#16262b">Nhai kỹ,</text>
<text x="412" y="154" font-size="15" fill="#16262b">không ăn vội</text>
</g>
<g>
<rect x="24" y="218" width="268" height="140" rx="14" fill="#fbf0de"/>
<path d="M62 300 a26 26 0 1 0 30 -40 a22 22 0 1 1 -30 40 z" fill="#d9902b"/>
<text x="128" y="268" font-size="18" font-weight="700" fill="#a86a12">Ăn tối sớm</text>
<text x="128" y="290" font-size="15" fill="#16262b">Xong bữa ít nhất</text>
<text x="128" y="310" font-size="15" fill="#16262b">2–3 giờ trước khi nằm</text>
</g>
<g>
<rect x="308" y="218" width="268" height="140" rx="14" fill="#fbf0de"/>
<rect x="342" y="252" width="46" height="60" rx="5" fill="#fff" stroke="#d9902b" stroke-width="4"/>
<path d="M352 270 h26 M352 284 h26 M352 298 h16" stroke="#d9902b" stroke-width="3"/>
<text x="412" y="268" font-size="18" font-weight="700" fill="#a86a12">Ghi nhật ký</text>
<text x="412" y="290" font-size="15" fill="#16262b">Tìm món làm nặng</text>
<text x="412" y="310" font-size="15" fill="#16262b">triệu chứng ở bạn</text>
</g>
</svg>
