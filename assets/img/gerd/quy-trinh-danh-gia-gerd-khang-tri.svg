<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="Be Vietnam Pro, Arial, Helvetica, sans-serif">
<rect width="600" height="520" rx="16" fill="#ffffff"/>
<defs><marker id="m" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#56686d"/></marker></defs>
<text x="300" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#16262b">Uống thuốc vẫn chưa đỡ: bác sĩ làm gì?</text>
<g font-size="16" text-anchor="middle">
<rect x="130" y="56" width="340" height="50" rx="12" fill="#fbe6e3"/><text x="300" y="87" font-weight="700" fill="#b4322a">Còn ợ nóng, ợ trớ dù đang dùng thuốc</text>
<path d="M300 106 V128" stroke="#56686d" stroke-width="3" marker-end="url(#m)"/>
<rect x="90" y="134" width="420" height="62" rx="12" fill="#e2f0ec"/><text x="300" y="160" font-weight="700" fill="#0e5a4c">1. Kiểm tra cách dùng thuốc</text><text x="300" y="182" font-size="15" fill="#16262b">Đúng giờ? Đều đặn? Liều, thời gian đã đủ?</text>
<path d="M300 196 V218" stroke="#56686d" stroke-width="3" marker-end="url(#m)"/>
<rect x="90" y="224" width="420" height="62" rx="12" fill="#e2f0ec"/><text x="300" y="250" font-weight="700" fill="#0e5a4c">2. Tối ưu điều trị</text><text x="300" y="272" font-size="15" fill="#16262b">Điều chỉnh PPI, lối sống, thuốc bổ sung có mục tiêu</text>
<path d="M300 286 V308" stroke="#56686d" stroke-width="3" marker-end="url(#m)"/>
<rect x="90" y="314" width="420" height="62" rx="12" fill="#fbf0de"/><text x="300" y="340" font-weight="700" fill="#a86a12">3. Thăm dò khi cần</text><text x="300" y="362" font-size="15" fill="#16262b">Nội soi · Đo pH – trở kháng 24 giờ · Đo áp lực (HRM)</text>
<path d="M240 376 L160 404" stroke="#56686d" stroke-width="3" marker-end="url(#m)"/><path d="M360 376 L440 404" stroke="#56686d" stroke-width="3" marker-end="url(#m)"/>
<rect x="24" y="410" width="266" height="86" rx="12" fill="#ffffff" stroke="#0e5a4c" stroke-width="2.5"/><text x="157" y="440" font-weight="700" fill="#0e5a4c">Có GERD khách quan</text><text x="157" y="462" font-size="15" fill="#16262b">→ GERD kháng trị: cân nhắc</text><text x="157" y="482" font-size="15" fill="#16262b">hướng điều trị tiếp theo</text>
<rect x="310" y="410" width="266" height="86" rx="12" fill="#ffffff" stroke="#d9902b" stroke-width="2.5"/><text x="443" y="440" font-weight="700" fill="#a86a12">Không phải GERD</text><text x="443" y="462" font-size="15" fill="#16262b">→ tìm và điều trị</text><text x="443" y="482" font-size="15" fill="#16262b">nguyên nhân khác</text>
</g>
</svg>
