<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="Be Vietnam Pro, Arial, Helvetica, sans-serif">
<rect width="600" height="430" rx="16" fill="#ffffff"/>
<text x="300" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#16262b">Vị trí khó chịu thường gặp</text>
<g transform="translate(200 50)">
<circle cx="100" cy="40" r="30" fill="#e7eeec"/>
<path d="M40 100 Q100 76 160 100 L172 300 Q100 322 28 300 Z" fill="#e7eeec"/>
<ellipse cx="100" cy="150" rx="22" ry="52" fill="#b4322a" opacity=".55"/>
<ellipse cx="100" cy="228" rx="42" ry="24" fill="#d9902b" opacity=".75"/>
</g>
<line x1="322" y1="200" x2="400" y2="150" stroke="#b4322a" stroke-width="2"/>
<text x="406" y="140" font-size="18" font-weight="700" fill="#b4322a">GERD</text>
<text x="406" y="162" font-size="15" fill="#16262b">Nóng rát sau xương ức,</text>
<text x="406" y="182" font-size="15" fill="#16262b">có thể lan lên cổ</text>
<text x="406" y="202" font-size="15" fill="#16262b">Nặng hơn khi nằm, cúi</text>
<line x1="258" y1="278" x2="160" y2="300" stroke="#d9902b" stroke-width="2"/>
<text x="28" y="290" font-size="18" font-weight="700" fill="#a86a12">Viêm loét</text>
<text x="28" y="312" font-size="18" font-weight="700" fill="#a86a12">dạ dày – tá tràng</text>
<text x="28" y="334" font-size="15" fill="#16262b">Đau, nóng rát vùng</text>
<text x="28" y="354" font-size="15" fill="#16262b">thượng vị (trên rốn)</text>
<rect x="60" y="384" width="480" height="34" rx="8" fill="#fbf0de"/>
<text x="300" y="406" text-anchor="middle" font-size="15" fill="#16262b">Triệu chứng hai bệnh có thể chồng lấp – cần bác sĩ đánh giá</text>
</svg>
