 <text x="436" y="148" font-size="19" font-weight="700" fill="#b4322a">GERD</text>
 <text x="436" y="170">Nóng rát sau xương ức,</text><text x="436" y="190">có thể lan lên cổ</text><text x="436" y="210">Nặng hơn khi nằm, cúi</text>
