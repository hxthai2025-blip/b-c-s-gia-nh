 <text x="24" y="330" font-size="19" font-weight="700" fill="#a86a12">Viêm loét</text>
 <text x="24" y="352" font-size="19" font-weight="700" fill="#a86a12">dạ dày – tá tràng</text>
 <text x="24" y="374">Đau, nóng rát vùng</text><text x="24" y="394">thượng vị (trên rốn)</text>
