<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Be Vietnam Pro, Arial, Helvetica, sans-serif">
<defs>
 <linearGradient id="eso" x1="0" x2="1"><stop offset="0" stop-color="#c9675c"/><stop offset=".45" stop-color="#ef9f92"/><stop offset="1" stop-color="#b85a50"/></linearGradient>
 <radialGradient id="sto" cx=".45" cy=".35" r=".8"><stop offset="0" stop-color="#f7b9ad"/><stop offset=".6" stop-color="#e38b7e"/><stop offset="1" stop-color="#b85a50"/></radialGradient>
 <linearGradient id="wrap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4a99c"/><stop offset=".5" stop-color="#e0897b"/><stop offset="1" stop-color="#b9594d"/></linearGradient>
 <filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5a2a24" flood-opacity=".25"/></filter>
</defs>
<rect width="640" height="480" rx="16" fill="#ffffff"/>
<text x="320" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#16262b">Hai kiểu quấn đáy vị thường gặp</text>
<text x="320" y="62" text-anchor="middle" font-size="14" fill="#56686d">Đáy vị dạ dày được quấn quanh đoạn cuối thực quản để tạo “van” chống trào ngược</text>
<!-- Nissen -->
<g transform="translate(170 0)" filter="url(#sh)">
 <path d="M-14 80 L-14 230 M14 80 L14 230" stroke="none"/>
 <rect x="-17" y="80" width="34" height="160" rx="14" fill="url(#eso)"/>
 <path d="M-12 236 C-60 240 -100 290 -90 340 C-80 390 -10 400 40 384 C96 366 110 300 80 262 C60 238 30 232 14 236 Z" fill="url(#sto)"/>
 <!-- full wrap: back part -->
 <path d="M-46 168 C-46 150 46 150 46 168 L46 214 C46 232 -46 232 -46 214 Z" fill="#c26a5e"/>
 <!-- esophagus front visible? covered fully by wrap front -->
 <path d="M-50 176 C-50 196 50 196 50 176 L50 222 C50 244 -50 244 -50 222 Z" fill="url(#wrap)"/>
 <path d="M-50 176 C-50 196 50 196 50 176" fill="none" stroke="#f7c3b8" stroke-width="2.5"/>
 <g stroke="#7a3a32" stroke-width="2.5" stroke-linecap="round"><path d="M-3 196 v30"/><path d="M-9 200 h12 M-9 212 h12 M-9 224 h12" stroke-width="2"/></g>
</g>
<g transform="translate(170 0)">
 <text y="460" text-anchor="middle" font-size="15" fill="#16262b">Quấn toàn bộ 360° quanh thực quản</text>
 <text y="436" text-anchor="middle" font-size="20" font-weight="700" fill="#0e5a4c">Nissen</text>
</g>
<!-- Toupet -->
<g transform="translate(470 0)" filter="url(#sh)">
 <path d="M-46 168 C-46 150 46 150 46 168 L46 214 C46 232 -46 232 -46 214 Z" fill="#c26a5e"/>
 <rect x="-17" y="80" width="34" height="160" rx="14" fill="url(#eso)"/>
 <path d="M-12 236 C-60 240 -100 290 -90 340 C-80 390 -10 400 40 384 C96 366 110 300 80 262 C60 238 30 232 14 236 Z" fill="url(#sto)"/>
 <!-- partial: two flaps on sides, front of esophagus left open -->
 <path d="M-50 176 C-50 190 -30 196 -20 196 L-20 240 C-34 240 -50 234 -50 222 Z" fill="url(#wrap)"/>
 <path d="M50 176 C50 190 30 196 20 196 L20 240 C34 240 50 234 50 222 Z" fill="url(#wrap)"/>
 <g stroke="#7a3a32" stroke-width="2" stroke-linecap="round"><path d="M-22 204 l6 0 M-22 218 l6 0 M-22 232 l6 0"/><path d="M16 204 l6 0 M16 218 l6 0 M16 232 l6 0"/></g>
</g>
<g transform="translate(470 0)">
 <text y="436" text-anchor="middle" font-size="20" font-weight="700" fill="#0e5a4c">Toupet</text>
 <text y="460" text-anchor="middle" font-size="15" fill="#16262b">Quấn bán phần ~270°, để hở mặt trước</text>
</g>
<g font-size="13" fill="#56686d">
 <line x1="226" y1="110" x2="270" y2="104" stroke="#8a9a96"/><text x="274" y="108">Thực quản</text>
 <line x1="226" y1="200" x2="270" y2="150" stroke="#8a9a96"/><text x="274" y="148">Van quấn từ đáy vị</text>
 <line x1="250" y1="320" x2="290" y2="300" stroke="#8a9a96"/><text x="294" y="304">Dạ dày</text>
</g>
</svg>
