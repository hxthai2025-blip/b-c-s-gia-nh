<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="Be Vietnam Pro, Arial, Helvetica, sans-serif">
<rect width="600" height="380" rx="16" fill="#ffffff"/>
<text x="300" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#16262b">Hai kiểu quấn đáy vị thường gặp</text>
<text x="300" y="62" text-anchor="middle" font-size="14" fill="#56686d">Nhìn mặt cắt ngang đoạn cuối thực quản</text>
<g transform="translate(150 190)">
<circle r="80" fill="none" stroke="#e89a8f" stroke-width="34"/>
<circle r="44" fill="#f6d3cd" stroke="#e89a8f" stroke-width="4"/><circle r="16" fill="#ffffff"/>
<text y="130" text-anchor="middle" font-size="19" font-weight="700" fill="#0e5a4c">Nissen</text>
<text y="152" text-anchor="middle" font-size="15" fill="#16262b">Quấn toàn bộ 360°</text>
</g>
<g transform="translate(450 190)">
<path d="M -69.3 -40 A 80 80 0 1 0 69.3 -40" fill="none" stroke="#e89a8f" stroke-width="34" transform="rotate(180)"/>
<circle r="44" fill="#f6d3cd" stroke="#e89a8f" stroke-width="4"/><circle r="16" fill="#ffffff"/>
<text y="130" text-anchor="middle" font-size="19" font-weight="700" fill="#0e5a4c">Toupet</text>
<text y="152" text-anchor="middle" font-size="15" fill="#16262b">Quấn bán phần ~270°</text>
</g>
<g font-size="14" fill="#56686d">
<rect x="236" y="100" width="128" height="62" rx="8" fill="#f4f7f6"/>
<rect x="244" y="112" width="18" height="12" rx="3" fill="#e89a8f"/><text x="268" y="123">Đáy vị (quấn)</text>
<rect x="244" y="134" width="18" height="12" rx="3" fill="#f6d3cd" stroke="#e89a8f"/><text x="268" y="145">Thực quản</text>
</g>
</svg>
