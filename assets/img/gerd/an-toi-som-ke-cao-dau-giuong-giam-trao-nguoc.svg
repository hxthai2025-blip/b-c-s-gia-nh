<circle cx="60" cy="110" r="14" fill="#0e5a4c"/><circle cx="400" cy="110" r="14" fill="#0e5a4c"/>
<text x="60" y="148" text-anchor="middle" font-size="16" font-weight="600" fill="#16262b">Ăn tối xong</text>
<text x="400" y="148" text-anchor="middle" font-size="16" font-weight="600" fill="#16262b">Đi ngủ</text>
