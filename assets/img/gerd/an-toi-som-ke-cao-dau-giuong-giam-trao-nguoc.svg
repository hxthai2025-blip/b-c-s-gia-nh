<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Be Vietnam Pro, Arial, Helvetica, sans-serif">
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d4a6b"/><stop offset="1" stop-color="#456a8c"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a4785a"/><stop offset="1" stop-color="#7d5a42"/></linearGradient>
 <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9875f"/><stop offset="1" stop-color="#8a5d3d"/></linearGradient>
 <linearGradient id="blanket" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cc2a8"/><stop offset="1" stop-color="#2f8a74"/></linearGradient>
 <linearGradient id="pillow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe6ea"/></linearGradient>
 <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".9"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient>
 <linearGradient id="skin" x1="0" x2="1"><stop offset="0" stop-color="#e9b896"/><stop offset="1" stop-color="#d49a76"/></linearGradient>
 <filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".3"/></filter>
 <clipPath id="c"><rect x="0" y="0" width="640" height="460" rx="16"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="640" height="460" fill="url(#wall)"/>
<rect y="350" width="640" height="110" fill="url(#floor)"/>
<!-- window with moon -->
<rect x="440" y="70" width="150" height="120" rx="6" fill="#16304d" stroke="#d8c7b3" stroke-width="7"/>
<line x1="515" y1="70" x2="515" y2="190" stroke="#d8c7b3" stroke-width="5"/>
<circle cx="560" cy="108" r="18" fill="#fff4cf"/><circle cx="568" cy="102" r="16" fill="#16304d"/>
<g fill="#fff" opacity=".8"><circle cx="470" cy="100" r="1.8"/><circle cx="492" cy="150" r="1.4"/><circle cx="545" cy="160" r="1.6"/></g>
<!-- nightstand + clock -->
<ellipse cx="70" cy="240" rx="90" ry="70" fill="url(#lamp)"/>
<rect x="20" y="276" width="100" height="90" rx="6" fill="url(#wood)" filter="url(#sh)"/>
<rect x="30" y="300" width="80" height="5" fill="#6f4a30" opacity=".5"/>
<rect x="40" y="244" width="62" height="32" rx="6" fill="#1b1f24"/>
<text x="71" y="268" text-anchor="middle" font-size="19" font-weight="700" fill="#ff5a4d" font-family="Courier New, monospace">22:00</text>
<!-- bed (head raised on blocks at left) -->
<g filter="url(#sh)">
 <rect x="138" y="180" width="26" height="180" rx="6" fill="url(#wood)"/>
 <rect x="156" y="318" width="22" height="34" fill="#6f4a30"/><rect x="150" y="350" width="34" height="14" rx="3" fill="#c9b49a"/>
 <rect x="560" y="342" width="22" height="20" fill="#6f4a30"/>
 <path d="M158 300 L600 336 L600 356 L158 322 Z" fill="url(#wood)"/>
 <path d="M160 276 L598 314 L598 340 L160 304 Z" fill="#f4f1ec"/>
</g>
<!-- person -->
<ellipse cx="214" cy="262" rx="44" ry="18" fill="url(#pillow)" transform="rotate(5 214 262)"/>
<circle cx="230" cy="246" r="22" fill="url(#skin)"/>
<path d="M210 236 Q226 216 250 234 Q240 226 222 230 Z" fill="#3b2a20"/>
<path d="M238 252 q5 3 10 0" stroke="#7a4a35" stroke-width="2" fill="none"/>
<path d="M246 262 C300 250 380 256 470 278 C530 292 580 300 598 312 L598 330 L250 300 Z" fill="url(#blanket)"/>
<path d="M246 262 C300 250 380 256 470 278" fill="none" stroke="#9fe0cf" stroke-width="3" opacity=".7"/>
<text x="436" y="236" font-size="22" fill="#cfe3ff" opacity=".85" font-weight="700">z</text><text x="456" y="216" font-size="17" fill="#cfe3ff" opacity=".7" font-weight="700">z</text>
</g>
<!-- captions -->
<rect x="18" y="16" width="604" height="40" rx="10" fill="#ffffff" opacity=".95"/>
<text x="320" y="43" text-anchor="middle" font-size="20" font-weight="700" fill="#16262b">Giảm trào ngược về đêm</text>
<g font-size="15">
<rect x="18" y="384" width="290" height="62" rx="10" fill="#ffffff" opacity=".95"/>
<text x="34" y="408" font-weight="700" fill="#0e5a4c">Ăn tối xong ít nhất 2–3 giờ</text><text x="34" y="430" fill="#16262b">rồi mới đi nằm</text>
<rect x="320" y="384" width="302" height="62" rx="10" fill="#ffffff" opacity=".95"/>
<text x="336" y="408" font-weight="700" fill="#a86a12">Kê cao chân giường phía đầu</text><text x="336" y="430" fill="#16262b">Chồng thêm gối thường không đủ</text>
</g>
</svg>
