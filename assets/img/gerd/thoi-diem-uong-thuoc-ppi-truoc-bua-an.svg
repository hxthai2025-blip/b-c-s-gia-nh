<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="Be Vietnam Pro, Arial, Helvetica, sans-serif">
<rect width="600" height="340" rx="16" fill="#ffffff"/>
<text x="300" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#16262b">Uống PPI thông thường đúng thời điểm</text>
<g transform="translate(70 80)">
<rect x="0" y="40" width="70" height="34" rx="17" fill="#0e5a4c"/><rect x="35" y="40" width="35" height="34" rx="0" fill="#5cc2a8"/><rect x="35" y="40" width="35" height="34" rx="17" fill="#5cc2a8"/><rect x="35" y="40" width="10" height="34" fill="#5cc2a8"/>
<text x="35" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#16262b">Uống thuốc</text>
<text x="35" y="132" text-anchor="middle" font-size="15" fill="#56686d">với nước lọc</text>
</g>
<path d="M170 137 L380 137" stroke="#d9902b" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#m)"/>
<defs><marker id="m" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d9902b"/></marker></defs>
<rect x="200" y="96" width="150" height="30" rx="15" fill="#fbf0de"/>
<text x="275" y="117" text-anchor="middle" font-size="17" font-weight="700" fill="#a86a12">30–60 phút</text>
<g transform="translate(400 70)">
<ellipse cx="70" cy="80" rx="62" ry="22" fill="#e2f0ec" stroke="#0e5a4c" stroke-width="4"/>
<path d="M30 70 q40 -40 80 0" fill="#f2c14e"/><circle cx="55" cy="62" r="8" fill="#d9902b"/><circle cx="85" cy="60" r="7" fill="#5cc2a8"/>
<text x="70" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#16262b">Ăn bữa sáng</text>
<text x="70" y="162" text-anchor="middle" font-size="15" fill="#56686d">(hoặc bữa tối nếu</text>
<text x="70" y="182" text-anchor="middle" font-size="15" fill="#56686d">uống lần thứ hai)</text>
</g>
<rect x="40" y="268" width="520" height="52" rx="10" fill="#fbe6e3"/>
<text x="300" y="290" text-anchor="middle" font-size="15" fill="#b4322a" font-weight="600">Không tự tăng liều, không phối hợp nhiều PPI.</text>
<text x="300" y="310" text-anchor="middle" font-size="15" fill="#16262b">Một số thuốc có cách dùng khác – làm theo hướng dẫn của bác sĩ.</text>
</svg>
