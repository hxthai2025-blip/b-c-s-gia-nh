<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="Be Vietnam Pro, Arial, Helvetica, sans-serif">
<rect width="600" height="440" rx="16" fill="#ffffff"/>
<text x="300" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#16262b">Trào ngược dạ dày – thực quản xảy ra như thế nào?</text>
<g transform="translate(-50 0)"><!-- esophagus -->
<path d="M190 70 L190 230 Q190 262 214 272" fill="none" stroke="#e89a8f" stroke-width="40" stroke-linecap="round"/>
<path d="M190 70 L190 230 Q190 262 214 272" fill="none" stroke="#f6d3cd" stroke-width="22" stroke-linecap="round"/>
<!-- stomach -->
<path d="M200 262 C230 250 270 252 300 262 C380 280 420 330 400 380 C380 420 300 425 255 400 C215 378 205 330 222 300 C230 285 215 276 200 262 Z" fill="#f6d3cd" stroke="#e89a8f" stroke-width="5"/>
<!-- acid -->
<path d="M226 350 C260 340 330 345 395 352 C395 380 370 405 310 408 C260 408 232 385 226 350 Z" fill="#f2c14e" opacity=".85"/>
<!-- LES -->
<rect x="164" y="236" width="52" height="16" rx="6" fill="#0e5a4c" transform="rotate(28 190 244)"/>
<!-- reflux arrows -->
<path d="M190 225 L190 120" stroke="#b4322a" stroke-width="5" fill="none" marker-end="url(#a)" stroke-dasharray="10 7"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b4322a"/></marker></defs>
</g><!-- labels -->
<line x1="164" y1="110" x2="296" y2="96" stroke="#56686d" stroke-width="1.5"/>
<text x="302" y="92" font-size="18" font-weight="600" fill="#16262b">Thực quản</text>
<text x="302" y="114" font-size="15" fill="#56686d">Dịch dạ dày trào ngược lên</text><text x="302" y="134" font-size="15" fill="#56686d">gây ợ nóng, ợ trớ</text>
<line x1="166" y1="250" x2="296" y2="196" stroke="#56686d" stroke-width="1.5"/>
<text x="302" y="198" font-size="18" font-weight="600" fill="#0e5a4c">Cơ thắt thực quản dưới</text>
<text x="302" y="220" font-size="15" fill="#56686d">Bình thường đóng lại như một “van”.</text>
<text x="302" y="240" font-size="15" fill="#56686d">Khi van hở hoặc yếu,</text><text x="302" y="260" font-size="15" fill="#56686d">dịch dạ dày dễ trào lên</text>
<line x1="355" y1="320" x2="400" y2="300" stroke="#56686d" stroke-width="1.5"/>
<text x="406" y="296" font-size="18" font-weight="600" fill="#16262b">Dạ dày</text>
<text x="406" y="318" font-size="15" fill="#56686d">chứa acid, pepsin</text>
<text x="300" y="428" text-anchor="middle" font-size="13" fill="#56686d">Hình minh họa đơn giản, không theo tỉ lệ giải phẫu</text>
</svg>
