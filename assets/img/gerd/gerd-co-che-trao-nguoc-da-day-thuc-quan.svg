<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="Be Vietnam Pro, Arial, Helvetica, sans-serif">
<defs>
 <linearGradient id="eso" x1="0" x2="1"><stop offset="0" stop-color="#c9675c"/><stop offset=".45" stop-color="#ef9f92"/><stop offset="1" stop-color="#b85a50"/></linearGradient>
 <radialGradient id="sto" cx=".42" cy=".35" r=".75"><stop offset="0" stop-color="#f7b9ad"/><stop offset=".6" stop-color="#e38b7e"/><stop offset="1" stop-color="#b85a50"/></radialGradient>
 <linearGradient id="acid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5d76e"/><stop offset="1" stop-color="#d9a72b"/></linearGradient>
 <linearGradient id="dia" x1="0" x2="1"><stop offset="0" stop-color="#b9785f" stop-opacity="0"/><stop offset=".2" stop-color="#c98a6f"/><stop offset=".8" stop-color="#c98a6f"/><stop offset="1" stop-color="#b9785f" stop-opacity="0"/></linearGradient>
 <linearGradient id="skin" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f3ece8"/><stop offset="1" stop-color="#ebe2dc"/></linearGradient>
 <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#5a2a24" flood-opacity=".25"/></filter>
 <clipPath id="stoClip"><path d="M228 250 C214 238 214 226 226 222 C268 206 330 214 368 246 C420 290 438 360 404 412 C374 456 300 466 252 436 C214 412 206 360 226 322 C236 302 246 274 228 250 Z"/></clipPath>
 <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b4322a"/></marker>
</defs>
<rect width="640" height="520" rx="16" fill="#ffffff"/>
<text x="320" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#16262b">Trào ngược dạ dày – thực quản xảy ra như thế nào?</text>
<!-- torso silhouette -->
<path d="M110 70 Q120 58 160 56 L330 56 Q372 58 382 70 L420 150 Q446 230 446 330 L440 500 L70 500 L64 330 Q64 230 88 150 Z" fill="url(#skin)"/>
<!-- ribs hint -->
<g fill="none" stroke="#e2d6cf" stroke-width="5" stroke-linecap="round">
 <path d="M246 120 Q170 128 128 170"/><path d="M246 148 Q166 160 120 208"/><path d="M246 176 Q166 192 118 246"/>
 <path d="M246 120 Q322 128 364 170"/><path d="M246 148 Q326 160 372 208"/><path d="M246 176 Q326 192 374 246"/>
</g>
<!-- diaphragm -->
<path d="M84 236 Q170 196 246 214 Q322 196 408 236" fill="none" stroke="url(#dia)" stroke-width="14" stroke-linecap="round"/>
<!-- esophagus -->
<g filter="url(#sh)">
 <path d="M232 60 C230 120 236 170 236 214 C236 236 230 246 228 252" fill="none" stroke="url(#eso)" stroke-width="36" stroke-linecap="round"/>
 <g stroke="#b55a4f" stroke-width="1.6" opacity=".55"><path d="M216 90 h32"/><path d="M216 110 h32"/><path d="M217 130 h32"/><path d="M218 150 h32"/><path d="M219 170 h32"/><path d="M219 190 h32"/></g>
 <!-- stomach -->
 <path d="M228 250 C214 238 214 226 226 222 C268 206 330 214 368 246 C420 290 438 360 404 412 C374 456 300 466 252 436 C214 412 206 360 226 322 C236 302 246 274 228 250 Z" fill="url(#sto)"/>
 <!-- duodenum -->
 <path d="M262 432 C240 446 220 452 196 448" fill="none" stroke="#d47a6d" stroke-width="22" stroke-linecap="round"/>
</g>
<!-- acid pool & rugae -->
<g clip-path="url(#stoClip)">
 <path d="M200 372 C260 360 340 362 440 372 L440 480 L200 480 Z" fill="url(#acid)" opacity=".9"/>
 <path d="M200 372 C260 360 340 362 440 372" fill="none" stroke="#fff3c4" stroke-width="3"/>
 <g fill="none" stroke="#c8695c" stroke-width="2.4" opacity=".55" stroke-linecap="round">
  <path d="M262 262 C300 270 330 290 352 318"/><path d="M252 290 C290 300 322 320 340 350"/><path d="M290 240 C330 252 360 278 378 312"/>
 </g>
 <g fill="#fff6d6" opacity=".8"><circle cx="300" cy="400" r="5"/><circle cx="330" cy="420" r="3.5"/><circle cx="276" cy="418" r="3"/><circle cx="360" cy="396" r="4"/></g>
</g>
<!-- LES -->
<ellipse cx="231" cy="234" rx="24" ry="9" fill="#0e5a4c" opacity=".9"/>
<ellipse cx="231" cy="232" rx="20" ry="4" fill="#5cc2a8" opacity=".7"/>
<!-- reflux droplets -->
<g fill="#e9bb3a"><ellipse cx="234" cy="200" rx="5" ry="7"/><ellipse cx="231" cy="172" rx="4.5" ry="6.5"/><ellipse cx="235" cy="146" rx="4" ry="6"/><ellipse cx="232" cy="122" rx="3.5" ry="5"/></g>
<path d="M262 206 C278 170 278 130 262 96" fill="none" stroke="#b4322a" stroke-width="3.5" marker-end="url(#ar)"/>
<!-- inset -->
<g transform="translate(548 300)">
 <circle r="66" fill="#fff" stroke="#dbe4e2" stroke-width="3"/>
 <text y="-74" text-anchor="middle" font-size="14" font-weight="600" fill="#56686d">Phóng to chỗ nối</text>
 <path d="M-14 -60 L-14 -6 M14 -60 L14 -6" stroke="#d47a6d" stroke-width="8" stroke-linecap="round"/>
 <path d="M-14 -6 C-30 10 -44 26 -50 44 M14 -6 C34 8 50 22 54 42" stroke="#d47a6d" stroke-width="8" fill="none" stroke-linecap="round"/>
 <rect x="-26" y="-14" width="14" height="14" rx="3" fill="#0e5a4c"/><rect x="12" y="-14" width="14" height="14" rx="3" fill="#0e5a4c"/>
 <path d="M0 30 L0 -42" stroke="#b4322a" stroke-width="3" marker-end="url(#ar)"/>
 <text y="58" text-anchor="middle" font-size="13" fill="#16262b">van hở → trào ngược</text>
</g>
<!-- labels -->
<g font-size="15" fill="#56686d">
<line x1="252" y1="80" x2="430" y2="80" stroke="#8a9a96" stroke-width="1.3"/>
<text x="436" y="76" font-size="17" font-weight="700" fill="#16262b">Thực quản</text><text x="436" y="96">Dịch dạ dày trào lên</text><text x="436" y="114">gây ợ nóng, ợ trớ</text>
<line x1="256" y1="236" x2="430" y2="166" stroke="#8a9a96" stroke-width="1.3"/>
<text x="436" y="160" font-size="17" font-weight="700" fill="#0e5a4c">Cơ thắt thực quản dưới</text><text x="436" y="180">“van” một chiều, hở hoặc yếu</text><text x="436" y="198">thì acid dễ trào ngược</text>
<text x="96" y="226" font-size="14" fill="#a06a52">Cơ hoành</text>
<line x1="396" y1="410" x2="470" y2="430" stroke="#8a9a96" stroke-width="1.3"/>
<text x="476" y="428" font-size="17" font-weight="700" fill="#16262b">Dạ dày</text><text x="476" y="448">chứa acid, pepsin</text>
</g>
<text x="320" y="510" text-anchor="middle" font-size="12" fill="#8a9a96">Hình minh họa, không theo đúng tỉ lệ giải phẫu</text>
</svg>
