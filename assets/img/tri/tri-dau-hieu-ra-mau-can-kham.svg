<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Be Vietnam Pro, Arial, Helvetica, sans-serif">
<defs>
 <path id="drop" d="M0 -12 C8 0 10 6 0 12 C-10 6 -8 0 0 -12Z"/>
</defs>
<rect width="640" height="420" rx="16" fill="#fff"/>
<text x="320" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#16262b">Đi ngoài ra máu: dấu hiệu nào cần chú ý?</text>
<rect x="24" y="58" width="284" height="262" rx="14" fill="#e2f0ec"/>
<rect x="332" y="58" width="284" height="262" rx="14" fill="#fbe9d6"/>
<text x="44" y="92" font-size="19" font-weight="700" fill="#0e5a4c">Hay gặp ở bệnh trĩ</text>
<text x="352" y="92" font-size="19" font-weight="700" fill="#b4601a">Nên đi khám sớm</text>
<g font-size="15" fill="#16262b">
 <use href="#drop" x="52" y="124" fill="#d63a31"/><text x="72" y="130">Máu đỏ tươi dính giấy</text><text x="72" y="150">hoặc phủ ngoài phân</text>
 <circle cx="52" cy="184" r="9" fill="#e86a5e"/><text x="72" y="190">Búi trĩ sa ra ngoài</text>
 <path d="M44 226h16M44 232h16M44 238h16" stroke="#0e8a6e" stroke-width="3" stroke-linecap="round"/><text x="72" y="236">Ngứa, ẩm ướt, vướng</text>
 <path d="M52 270l8 14h-16z" fill="#7a6bd1"/><text x="72" y="282">Trĩ nội thường ít đau</text>
 <use href="#drop" x="360" y="124" fill="#d63a31"/><text x="380" y="130">Chảy máu lần đầu,</text><text x="380" y="150">hoặc tái diễn nhiều lần</text>
 <use href="#drop" x="360" y="186" fill="#b92f2a" transform="translate(0 0) scale(1)"/><text x="380" y="192">Lượng máu tăng dần,</text><text x="380" y="212">thiếu máu, mệt mỏi</text>
 <circle cx="360" cy="248" r="8" fill="#e9843a"/><text x="380" y="254">Sụt cân, đau bụng kéo dài</text>
 <path d="M352 284h16" stroke="#e9843a" stroke-width="4" stroke-linecap="round"/><text x="380" y="290">Thay đổi khuôn phân</text>
</g>
<rect x="24" y="336" width="592" height="60" rx="12" fill="#fbe6e3" stroke="#b4322a" stroke-width="2"/>
<text x="320" y="362" text-anchor="middle" font-size="17" font-weight="700" fill="#b4322a">Cấp cứu (gọi 115): chảy máu nhiều kèm choáng, ngất</text>
<text x="320" y="384" text-anchor="middle" font-size="14" fill="#16262b">hoặc đau dữ dội kèm sốt. Không tự kết luận chảy máu hậu môn là do trĩ.</text>
</svg>
