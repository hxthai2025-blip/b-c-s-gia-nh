<g font-size="16" font-weight="700" text-anchor="middle" fill="#16262b"><text x="76" y="228">Rau xanh</text><text x="204" y="228">Trái cây</text><text x="332" y="228">Các loại đậu</text><text x="460" y="228">Yến mạch,</text><text x="460" y="248">ngũ cốc</text><text x="576" y="228">Nước</text></g>
